{% extends 'layout.html' %}
{% load widget_tweaks %}

{% block content %}
<form method="POST" action="">
    <div class="card card-default">
        <div class="card-header">
            <h3 class="card-title">
            <i class="fas fa-trash"></i>
            {{ title }}
            </h3>
        </div>
        <div class="card-body">
            {% csrf_token %}

            <div class="alert alert-warning alert-dismissible">
                <h5><i class="icon fas fa-ban"></i> Notificación!</h5>
                ¿Estás seguro que deseas eliminar el registro '{{ object.id }}: {{ object.nombre }}'?
            </div>

        </div>
        <div class="card-footer">
            <button type="submit" class="btn btn-danger btn-m" id="btn-test">
                Confirmar Eliminación
                <i class="fas fa-trash"></i>
            </button>
            <a href="{{ list_url }}" type="submit" class="btn btn-primary btn-m" id="btn-test">
                Cancelar
                <i class="fas fa-undo"></i>
            </a>
        </div>
    </div>
</form>

{% endblock %}
